# Builds the React hub and deploys dist/ to GitHub Pages.
#
# How to add games / pages yourself: docs/HOW_TO_UPDATE.md
# Pages source: repo Settings → Pages → GitHub Actions
# Firebase web config: cms/firebase-config.json (optional VITE_FIREBASE_* secrets)
# Games: games.json + games/ folder


name: Deploy to GitHub Pages

on:
  push:
    branches: [main, fixing.fortfury]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Check Firebase secrets visible to this workflow
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          ok=1
          if [ -z "${VITE_FIREBASE_API_KEY:-}" ]; then
            echo "::warning::VITE_FIREBASE_API_KEY is empty. Add Firebase secrets — see docs/NO_SUPABASE_SETUP.md"
            ok=0
          fi
          if [ -z "${VITE_FIREBASE_AUTH_DOMAIN:-}" ]; then
            echo "::warning::VITE_FIREBASE_AUTH_DOMAIN is empty."
            ok=0
          fi
          if [ -z "${VITE_FIREBASE_PROJECT_ID:-}" ]; then
            echo "::warning::VITE_FIREBASE_PROJECT_ID is empty."
            ok=0
          fi
          if [ "$ok" -eq 1 ]; then
            echo "Firebase env vars are non-empty for this build."
          fi

      - name: Install and build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_AUTH_REDIRECT_URL: ${{ secrets.VITE_AUTH_REDIRECT_URL }}
          VITE_GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: npm ci && npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
